<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyMiniApp</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --txt:var(--tg-theme-text-color,#1c1c1e);
  --hint:var(--tg-theme-hint-color,#7b7b85);
  --link:var(--tg-theme-link-color,#2a6fdb);
  --btn:var(--tg-theme-button-color,#2a6fdb);
  --btnt:var(--tg-theme-button-text-color,#ffffff);
  --sec:var(--tg-theme-secondary-bg-color,#f2f2f7);
  --line:rgba(128,128,140,.25);
  --ok:#2e9e5b;--warn:#d98a00;--bad:#d64545;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--sec);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto;background:var(--sec)}
.top{padding:14px 16px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:20px}
.top .sub{color:var(--hint);font-size:13px;margin-top:2px}
.body{flex:1;overflow:auto;padding:12px 12px 90px}
.tabs{display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 9px;font-size:12px;color:var(--hint);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:20px;line-height:1}
.tabs button.on{color:var(--btn)}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;margin:0 -12px;padding-left:12px;padding-right:12px}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--hint)}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card{background:var(--bg);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card h3{margin:0;font-size:16px;word-break:break-word}
.meta{color:var(--hint);font-size:13px;margin-top:2px;word-break:break-word}
.price{font-weight:700;white-space:nowrap}
.badge{display:inline-block;font-size:12px;border-radius:6px;padding:2px 7px;background:var(--sec);color:var(--hint);margin-right:6px}
.st{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;color:#fff;background:var(--hint)}
.st.work,.st.wrote{background:var(--warn)}
.st.done,.st.yes{background:var(--ok)}
.st.paid{background:#1b7a43}
.st.no,.st.lost{background:var(--bad)}
.st.later{background:#8a5cd6}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:0;border-radius:10px;padding:9px 13px;background:var(--btn);color:var(--btnt);font-size:14px;font-weight:600;text-decoration:none;display:inline-block}
.btn.sec{background:var(--sec);color:var(--txt)}
.btn.red{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn[disabled]{opacity:.45}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--btn);color:var(--btnt);font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--hint);padding:36px 16px}
.empty b{display:block;color:var(--txt);font-size:17px;margin-bottom:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:18px}
.f{display:block;margin-bottom:10px}
.f span{display:block;font-size:12px;color:var(--hint);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--sec);border-radius:10px;padding:10px 12px}
.f textarea{min-height:90px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--hint);margin:6px 0 12px}
.sec-t{font-size:13px;color:var(--hint);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 6px}
.inb{background:var(--bg);border:1.5px solid var(--btn);border-radius:14px;padding:12px;margin-bottom:12px}
.inb .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.inb .hd b{font-size:15px}
.inb .it{border-top:1px solid var(--line);padding:10px 0}
.inb .it h4{margin:0;font-size:15px;word-break:break-word}
.inb .sm{padding:6px 10px;font-size:13px}
.lim{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.lim .t{display:flex;justify-content:space-between;font-size:14px}
.lim .bar{height:8px;border-radius:99px;background:var(--sec);margin-top:8px;overflow:hidden}
.lim .bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.lim.warn .bar i{background:var(--warn)}
.lim.full .bar i{background:var(--bad)}
.tip{font-size:13px;color:var(--hint);background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.saved{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.saved.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="saved" id="saved">Сохранено</div>
<script>
'use strict';
// ───────── настройки и состояние ─────────
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const DEMO = /[?&]demo=1/.test(location.search);
const IN_TG = !!(TG && TG.initData);                       // есть только внутри Telegram
const POPUP = IN_TG && TG.isVersionAtLeast && TG.isVersionAtLeast('6.2');
const notify = (m) => { if (POPUP) TG.showAlert(m); else alert(m); };
const ORDER_ST = [['new','Новый'],['sent','Откликнулся'],['work','В работе'],['done','Сдан'],['paid','Оплачен'],['lost','Не вышло']];
const CONT_ST = [['none','Не писал'],['wrote','Написал'],['yes','Ответил «да»'],['no','Ответил «нет»'],['later','Повторить']];
const SRC = [['kwork','Kwork'],['yandex','Яндекс'],['youdo','YouDo'],['avito','Авито'],['hh','hh.ru'],['other','Другое']];
const T1 = 'Здравствуйте!\n\nУвидел вашу компанию «{название}» ({адрес}) на Яндекс.Картах{оценка}.\n\nОбратил внимание, что отдельного сайта пока нет. Перед Новым годом многие заказывают календари, и часть клиентов выбирает тех, у кого сразу видны виды календарей, тиражи и цены.\n\nЯ делаю сайты для типографий. Есть готовый пример страницы квартальных календарей с таблицей цен по тиражам — могу прислать ссылку, если интересно. За 1–2 дня соберу такой же под вас, сначала покажу бесплатно.\n\nВот скриншот примера сайта!';
const T2 = 'Спасибо! Вот пример: {ссылка}\nТам виды календарей (ламинация, пружина, блоки), таблица цен по тиражам и контакты, с телефона всё удобно. За 1–2 дня соберу такой же под вас: ваше название, цены, адрес. Сначала покажу — понравится, обсудим, нет — ничего не должны.';

const DEF_REPLIES = [
  ['r1', 'Kwork: готовое демо', 'Здравствуйте! Собрал для вас готовый вариант сайта на основе вашего ТЗ. Структура и подача уже на месте — останется заменить контент на ваш и учесть пожелания. Можно посмотреть здесь: {демо}'],
  ['r2', 'Сайт-визитка / одностраничник', 'Здравствуйте! Сделаю дизайн и вёрстку сайта-визитки или одностраничника за 1–2 дня. Сначала покажу готовый вариант, платите только если понравится. Тексты под вашу нишу пишу сам, подберу фото, сайт удобно смотреть с телефона. После сдачи 14 дней бесплатных правок. Сейчас для первых клиентов скидка 10% и логотип в подарок. Напишите, чем вы занимаетесь, и я пришлю в чат примеры живых сайтов для похожего бизнеса.'],
  ['r3', 'Несколько небольших сайтов', 'Здравствуйте! Сделаю оба сайта. Каждый собираю за 1–2 дня: что продаёте, преимущества, цены, фото, отзывы и кнопки связи, удобный вид на телефоне. Сначала показываю готовый сайт, оплата после результата. 14 дней правок бесплатно. Помогу разместить сайт и подключить домен. Расскажите, что за товары и есть ли фото, и я пришлю в чат примеры своих сайтов и точную цену.'],
  ['r4', 'Логотип', 'Здравствуйте! Предложу 2–3 варианта логотипа для <ниша>: не шаблонный, а свой знак и шрифт, чтобы логотип узнавался на упаковке, в соцсетях и на сайте. Первые варианты пришлю за 1 день, оплата после того, как выберете понравившийся. Правки бесплатно, отдам файлы в PNG и SVG. Напишите название и какое настроение хочется (нежное, дерзкое, премиальное). Если понадобится сайт-витрина, сделаю его тоже.'],
  ['r5', 'Лендинг с SEO-индексацией', 'Здравствуйте! Сделаю лендинг на <N> страницы за 1–2 дня. Настрою заголовки, описания и разметку, чтобы сайт индексировался в Яндексе и Google, и добавлю его в Вебмастер. Сначала покажу результат, оплата после. 14 дней правок. Напишите тематику, и я пришлю примеры.'],
  ['r6', 'Листовка / баннер', 'Здравствуйте! Сделаю <листовку/баннер> по вашим образцам: крупное фото, цена, главные плюсы и контакт, читается с двух метров. Первый вариант за день, оплата после результата, правки бесплатно. Отдам файл для печати и картинку для мессенджеров. Пришлите образцы и данные.']
];
const defaultReplies = () => DEF_REPLIES.map((r) => ({ id: r[0], name: r[1], text: r[2] }));
let S = fresh();
let tab = 'orders';       // orders | contacts | more
let fOrder = 'all', fCont = 'all', q = '';
let sheet = null;         // { html, bind }

function fresh() {
  return { v: 1, orders: [], contacts: [], cur: 'l1',
    lists: [{ id: 'l1', name: 'Типографии: календари', url: 'https://web-atelie.ru/kalendari/', t1: T1, t2: T2 }],
    inbox: { url: '', seen: [] }, replies: defaultReplies(), dayLimit: 10, intervalMin: 30, lastWriteAt: 0 };
}
let INBOX = { items: [], state: 'off', err: '', at: 0 };
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fmtDate = (s) => s ? s.slice(8, 10) + '.' + s.slice(5, 7) : '';
const money = (n) => (Math.round(+n || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lbl = (arr, k) => (arr.find((x) => x[0] === k) || [k, k])[1];
const curList = () => S.lists.find((l) => l.id === S.cur) || S.lists[0];

// ───────── хранение: облако Telegram, запасной вариант — память устройства ─────────
const CS = TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9') ? TG.CloudStorage : null;
const LS_KEY = 'myminiapp-data';
const csGet = (keys) => new Promise((r) => CS.getItems(keys, (e, v) => r(e ? {} : v || {})));
const csSet = (k, v) => new Promise((r) => CS.setItem(k, v, (e, ok) => r(!e && ok)));
const csDel = (keys) => new Promise((r) => CS.removeItems(keys, () => r()));

async function loadData() {
  if (DEMO) return null;
  let raw = null;
  if (CS) {
    const n = +((await csGet(['n'])).n || 0);
    if (n > 0) {
      const keys = Array.from({ length: n }, (_, i) => 'c' + i);
      const got = await csGet(keys);
      raw = keys.map((k) => got[k] || '').join('');
    }
  }
  if (!raw) { try { raw = localStorage.getItem(LS_KEY); } catch (e) {} }
  if (!raw) return null;
  try { const d = JSON.parse(raw); return d && d.v === 1 ? d : null; } catch (e) { return null; }
}

function chunk(str) {
  const out = []; let cur = '', bytes = 0;
  for (const ch of str) {
    const c = ch.codePointAt(0), b = c < 128 ? 1 : c < 2048 ? 2 : c < 65536 ? 3 : 4;
    if (bytes + b > 3400) { out.push(cur); cur = ''; bytes = 0; }
    cur += ch; bytes += b;
  }
  if (cur) out.push(cur);
  return out;
}
let saveTimer = null, prevN = 0;
function save() {
  if (DEMO) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const json = JSON.stringify(S);
    try { localStorage.setItem(LS_KEY, json); } catch (e) {}
    if (CS) {
      const parts = chunk(json);
      let ok = true;
      for (let i = 0; i < parts.length; i++) ok = (await csSet('c' + i, parts[i])) && ok;
      if (ok) {
        await csSet('n', String(parts.length));
        if (prevN > parts.length) await csDel(Array.from({ length: prevN - parts.length }, (_, i) => 'c' + (parts.length + i)));
        prevN = parts.length;
      }
    }
    const el = document.getElementById('saved');
    el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 900);
  }, 350);
}

// ───────── вспомогательное ─────────
function safeUrl(u) {
  try { const x = new URL(String(u).trim()); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; }
}
function openUrl(u) {
  const s = safeUrl(u); if (!s) return;
  if (IN_TG && TG.openLink) TG.openLink(s); else window.open(s, '_blank', 'noopener');
}
function detectSrc(u) {
  const s = String(u).toLowerCase();
  if (s.includes('kwork')) return 'kwork';
  if (s.includes('youdo')) return 'youdo';
  if (s.includes('avito')) return 'avito';
  if (s.includes('hh.ru')) return 'hh';
  if (s.includes('yandex') || s.includes('ya.ru')) return 'yandex';
  return 'other';
}
function guessTitle(u, src) {
  let m = String(u).match(/projects\/(\d+)/) || String(u).match(/youdo\.com\/t(\d+)/) || String(u).match(/vacancy\/(\d+)/) || String(u).match(/_(\d{6,})/);
  return m ? lbl(SRC, src) + ' №' + m[1] : '';
}
function normPhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1);
  if (d.length === 10) d = '7' + d;
  return d;
}
function waNumber(c) {
  const d = normPhone(c.wa || c.phone);
  return d.length >= 11 ? d : '';
}
function plural(n, a, b, c) { n = Math.abs(n) % 100; const k = n % 10; return n > 10 && n < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; }
function fillText(t, c, list) {
  let rate = '';
  const r = +c.rating, n = +c.reviews;
  if (r >= 4 && n >= 5) rate = ': рейтинг ' + String(r.toFixed(1)).replace('.', ',') + ' и ' + n + ' ' + plural(n, 'отзыв', 'отзыва', 'отзывов');
  return t.replace(/\{название\}/g, c.name || '').replace(/\{адрес\}/g, c.addr || '')
          .replace(/\{оценка\}/g, rate).replace(/\{ссылка\}/g, list.url || '');
}
function waLink(c, which) {
  const list = S.lists.find((l) => l.id === c.list) || curList();
  const num = waNumber(c); if (!num) return '';
  return 'https://wa.me/' + num + '?text=' + encodeURIComponent(fillText(which === 2 ? list.t2 : list.t1, c, list));
}
function confirmAsk(text, cb) {
  if (POPUP) TG.showConfirm(text, (ok) => ok && cb());
  else if (confirm(text)) cb();
}

// ───────── картинка для сообщения (хранится только на этом устройстве) ─────────
const imgKey = (id) => 'mma-img-' + id;
function getImg(id) { try { return localStorage.getItem(imgKey(id)) || ''; } catch (e) { return ''; } }
function setImg(id, data) {
  try { if (data) localStorage.setItem(imgKey(id), data); else localStorage.removeItem(imgKey(id)); return true; } catch (e) { return false; }
}
function processImage(file, maxW) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, maxW / im.width), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/png'));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function copyImage(dataUrl) {
  try {
    if (!(navigator.clipboard && window.ClipboardItem)) return false;
    const blob = await (await fetch(dataUrl)).blob();
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    return true;
  } catch (e) { return false; }
}

// ───────── темп отправки и «следующая компания» ─────────
const intervalMin = () => (S.intervalMin > 0 ? S.intervalMin : 30);
const waitLeft = () => Math.max(0, (S.lastWriteAt || 0) + intervalMin() * 60000 - Date.now());
function timerText() {
  const w = waitLeft();
  if (!w) return 'можно писать сейчас';
  const t = new Date(Date.now() + w), z = (n) => ('0' + n).slice(-2);
  return 'через ' + Math.ceil(w / 60000) + ' мин (в ' + z(t.getHours()) + ':' + z(t.getMinutes()) + ')';
}
function markWrote(c) { c.status = 'wrote'; c.wroteAt = today(); S.lastWriteAt = Date.now(); }
function nextContact() {
  const L = curList();
  // «Следующей» предлагаем тех, у кого WhatsApp указан в карточке или мобильный номер (городские обычно без WhatsApp)
  const mob = (c) => !!String(c.wa || '').replace(/\D/g, '') || /^79\d{9}$/.test(normPhone(c.phone));
  return S.contacts.find((c) => c.list === L.id && c.status === 'none' && waNumber(c) && mob(c));
}
function viewNext() {
  const c = nextContact(); if (!c) return '';
  const hasImg = !!getImg(curList().id);
  return '<div class="inb" style="border-color:var(--ok)"><div class="hd"><b>Следующая</b><span id="nxt-timer" class="meta">' + esc(timerText()) + '</span></div>' +
    '<h4 style="margin:0;font-size:16px">' + esc(c.name) + '</h4><div class="meta">' + esc(c.addr || '') +
    (c.rating ? ' · ★ ' + esc(String(c.rating).replace('.', ',')) : '') + '</div>' +
    '<div class="acts"><button class="btn" data-act="prep" data-id="' + c.id + '">' + (hasImg ? 'Подготовить' : 'Написать') + '</button>' +
    '<button class="btn sec" data-act="next-skip" data-id="' + c.id + '">Пропустить</button></div>' +
    (hasImg ? '' : '<div class="meta" style="margin-top:6px">Картинка не загружена: «Ещё» → «Тексты» у списка.</div>') + '</div>';
}
setInterval(() => { const e = document.getElementById('nxt-timer'); if (e) e.textContent = timerText(); }, 15000);

// ───────── счётчик «написано сегодня» ─────────
const todayCount = () => S.contacts.filter((c) => c.wroteAt === today()).length;
const dayLimit = () => (S.dayLimit > 0 ? S.dayLimit : 10);
function viewLimit() {
  const n = todayCount(), L = dayLimit();
  const cls = n >= L ? 'full' : n >= Math.ceil(L * 0.8) ? 'warn' : '';
  return '<div class="lim ' + cls + '"><div class="t"><span>Написано сегодня</span><b>' + n + ' из ' + L + '</b></div>' +
    '<div class="bar"><i style="width:' + Math.min(100, Math.round(n / L * 100)) + '%"></i></div>' +
    (n >= L ? '<div class="meta" style="margin-top:6px">Лимит на сегодня исчерпан. Лучше продолжить завтра.</div>' : '') + '</div>';
}

// ───────── входящие: заказы от сторожей через секретный gist ─────────
function gistId(u) { const m = String(u || '').match(/[0-9a-f]{20,40}/i); return m ? m[0] : ''; }
function cleanItem(i) {
  if (!i || typeof i.key !== 'string' || !/^(kwork|hh):/.test(i.key)) return null;
  const str = (v, n) => String(v == null ? '' : v).slice(0, n);
  return { key: i.key, src: i.src === 'hh' ? 'hh' : 'kwork', title: str(i.title, 200), price: Math.max(0, Math.round(+i.price || 0)),
    priceMax: Math.max(0, Math.round(+i.priceMax || 0)), url: safeUrl(i.url), note: str(i.note, 300), at: str(i.at, 25) };
}
async function fetchInbox(force) {
  if (DEMO) return;
  const id = gistId((S.inbox || {}).url);
  if (!id) { INBOX = { items: [], state: 'off', err: '', at: 0 }; return; }
  if (!force && Date.now() - INBOX.at < 60000) return;
  INBOX.at = Date.now();
  try {
    const r = await fetch('https://api.github.com/gists/' + id, { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('GitHub ответил ' + r.status);
    const g = await r.json();
    const f = g.files && g.files['inbox.json'];
    if (!f) throw new Error('в ячейке нет файла inbox.json');
    let txt = f.content;
    if (f.truncated && f.raw_url) txt = await (await fetch(f.raw_url)).text();
    const d = JSON.parse(txt);
    const items = (Array.isArray(d.items) ? d.items : []).map(cleanItem).filter(Boolean).slice(0, 150);
    INBOX = { items, state: 'ok', err: '', at: Date.now() };
  } catch (e) { INBOX = { items: INBOX.items, state: 'err', err: String(e && e.message || e), at: Date.now() }; }
  render();
}
function newInbox() {
  const seen = new Set((S.inbox || {}).seen || []);
  return INBOX.items.filter((i) => !seen.has(i.key));
}
function markSeen(keys) {
  S.inbox = S.inbox || { url: '', seen: [] };
  if (!Array.isArray(S.replies) || !S.replies.length) S.replies = defaultReplies();
  if (!(S.dayLimit > 0)) S.dayLimit = 10; if (!(S.intervalMin > 0)) S.intervalMin = 30;
  const set = new Set(S.inbox.seen);
  keys.forEach((k) => set.add(k));
  S.inbox.seen = Array.from(set).slice(-600);
}
function viewInbox() {
  const has = gistId((S.inbox || {}).url);
  if (!has) return '<div class="tip">Заказы от сторожей Kwork и hh.ru можно получать прямо сюда: «Ещё» → «Входящие».</div>';
  const list = newInbox();
  let h = '<div class="inb"><div class="hd"><b>Входящие · ' + (INBOX.state === 'ok' || list.length ? list.length + ' нов.' : '…') + '</b><div class="acts" style="margin:0">' +
    (list.length > 1 ? '<button class="btn sec sm" data-act="inbox-hide-all">Скрыть все</button>' : '') +
    '<button class="btn sec sm" data-act="inbox-refresh">Обновить</button></div></div>';
  if (INBOX.state === 'err') h += '<div class="meta" style="color:var(--bad)">Не удалось получить входящие: ' + esc(INBOX.err) + '</div>';
  else if (!list.length) h += '<div class="meta">' + (INBOX.state === 'ok' ? 'Новых нет. Всё разобрано.' : 'Загружаю…') + '</div>';
  list.slice(0, 10).forEach((i) => {
    h += '<div class="it"><h4>' + esc(i.title) + '</h4><div class="meta"><span class="badge">' + esc(i.src === 'hh' ? 'hh.ru' : 'Kwork') + '</span>' +
      (i.price ? money(i.price) + (i.priceMax > i.price ? ' – ' + money(i.priceMax) : '') : '') + (i.note ? ' · ' + esc(i.note) : '') + '</div>' +
      '<div class="acts" style="margin-top:8px"><button class="btn sm" data-act="inbox-reply" data-k="' + esc(i.key) + '">Отклик</button>' +
      '<button class="btn sec sm" data-act="inbox-take" data-k="' + esc(i.key) + '">В заказы</button>' +
      (i.url ? '<button class="btn sec sm" data-act="open-url" data-url="' + esc(i.url) + '">Открыть</button>' : '') +
      '<button class="btn sec sm" data-act="inbox-hide" data-k="' + esc(i.key) + '">Скрыть</button></div></div>';
  });
  if (list.length > 10) h += '<div class="meta">…и ещё ' + (list.length - 10) + '</div>';
  return h + '</div>';
}

    .replace(/\{сумма\}/g, o.price ? money(o.price) : '').replace(/\{срок\}/g, o.deadline ? fmtDate(o.deadline) : '');
}
async function copyText(t) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
  try { const ta = document.getElementById('r-text'); if (ta) { ta.focus(); ta.select(); return document.execCommand('copy'); } } catch (e) {}
  return false;
}
function replyWarn(txt) {
  const w = [];

  if (/<[^>]+>/.test(txt)) w.push('В тексте остались <скобки>: замените их вручную перед отправкой.');
  return w;
}

const val = (id) => (document.getElementById(id) || {}).value || '';
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'sheet-bg') { if (e.target === el) closeSheet(); return; }
  if (act === 'q' || act === 'list-switch') return;
  e.stopPropagation();
  switch (act) {
    case 'tab': tab = el.dataset.v; q = ''; render(); if (tab === 'orders') fetchInbox(false); break;
    case 'forder': fOrder = el.dataset.v; render(); break;
    case 'fcont': fCont = el.dataset.v; render(); break;
    case 'order-new': orderSheet(null); break;
    case 'order-edit': orderSheet(id); break;
    case 'order-save': {
      const url = val('o-url').trim(); const src = val('o-src'); const status = val('o-st');
      const rec = { title: val('o-title').trim() || guessTitle(url, src) || 'Без названия', src, url, price: val('o-price'),
        deadline: val('o-dl'), status, note: val('o-note').trim(), demo: val('o-demo').trim() };
      if (id) {
        const o = S.orders.find((x) => x.id === id);
        if (status === 'paid' && o.status !== 'paid') rec.paidAt = today();
        Object.assign(o, rec);
      } else { rec.id = uid(); rec.created = today(); if (status === 'paid') rec.paidAt = today(); S.orders.push(rec); }
      save(); closeSheet(); break;
    }
    case 'order-del': confirmAsk('Удалить заказ?', () => { S.orders = S.orders.filter((x) => x.id !== id); save(); closeSheet(); }); break;
    case 'open-url': openUrl(el.dataset.url); break;
    case 'cont-new': contactSheet(null); break;
    case 'cont-edit': contactSheet(id); break;
    case 'cont-save': {
      const rec = { name: val('c-name').trim(), addr: val('c-addr').trim(), phone: val('c-phone').trim(), wa: val('c-wa').trim(),
        rating: val('c-rate').replace(',', '.').trim(), reviews: val('c-rev').trim(), status: val('c-st'), note: val('c-note').trim() };
      if (!rec.name) { notify('Укажите название'); break; }
      const apply = (c) => { if (rec.status === 'later' && c.status !== 'later') rec.followAt = addDays(30);
        if (rec.status === 'wrote' && !c.wroteAt) rec.wroteAt = today(); Object.assign(c, rec); };
      if (id) apply(S.contacts.find((x) => x.id === id));
      else { const c = { id: uid(), list: curList().id }; apply(c); S.contacts.push(c); }
      save(); closeSheet(); break;
    }
    case 'cont-del': confirmAsk('Удалить компанию из списка?', () => { S.contacts = S.contacts.filter((x) => x.id !== id); save(); closeSheet(); }); break;
    case 'wa1': case 'wa2': {
      const c = S.contacts.find((x) => x.id === id); if (!c) break;
      const url = waLink(c, act === 'wa2' ? 2 : 1);
      const go = () => {
        if (act === 'wa1' && (c.status === 'none')) { markWrote(c); save(); }
        render(); openUrl(url);
      };
      if (act === 'wa1' && c.status === 'none' && todayCount() >= dayLimit())
        confirmAsk('Сегодня уже написано ' + todayCount() + ' из ' + dayLimit() + '. Лимит нужен, чтобы не получить блокировку. Написать ещё одному?', go);
      else go();
      break;
    }
    case 'list-new': listSheet(null); break;
    case 'list-edit': listSheet(id); break;
    case 'list-save': {
      const rec = { name: val('l-name').trim() || 'Список', url: val('l-url').trim(), t1: val('l-t1'), t2: val('l-t2') };
      if (id) Object.assign(S.lists.find((x) => x.id === id), rec);
      else { rec.id = uid(); S.lists.push(rec); S.cur = rec.id; }
      save(); closeSheet(); break;
    }
    case 'list-del': confirmAsk('Удалить список и все его компании?', () => {
      S.contacts = S.contacts.filter((c) => c.list !== id); S.lists = S.lists.filter((l) => l.id !== id);
      if (S.cur === id) S.cur = S.lists[0].id; save(); closeSheet(); }); break;
    case 'list-clear': {
      const l = S.lists.find((x) => x.id === id);
      const n = S.contacts.filter((c) => c.list === id).length;
      if (!l || !n) break;
      confirmAsk('Убрать из списка «' + l.name + '» все компании (' + n + ')? Заказы и тексты останутся.', () => {
        S.contacts = S.contacts.filter((c) => c.list !== id); save(); render(); });
      break;
    }
    case 'inbox-setup': inboxSheet(); break;
    case 'inbox-save': {
      const v = val('inb-url').trim();
      if (!gistId(v)) { notify('Не похоже на ссылку или номер ячейки'); break; }
      S.inbox = S.inbox || { url: '', seen: [] }; S.inbox.url = v; save();
      INBOX = { items: [], state: 'loading', err: '', at: 0 }; closeSheet(); fetchInbox(true); break;
    }
    case 'inbox-off': confirmAsk('Отключить входящие?', () => { S.inbox = { url: '', seen: [] }; INBOX = { items: [], state: 'off', err: '', at: 0 }; save(); closeSheet(); }); break;
    case 'inbox-refresh': INBOX.at = 0; fetchInbox(true); break;
    case 'inbox-hide': markSeen([el.dataset.k]); save(); render(); break;
    case 'inbox-hide-all': confirmAsk('Скрыть все новые (' + newInbox().length + ')?', () => { markSeen(newInbox().map((i) => i.key)); save(); render(); }); break;
    case 'prep': {
      const c = S.contacts.find((x) => x.id === id); if (!c) break;
      const url = waLink(c, 1);
      if (!url) { notify('У компании нет номера для WhatsApp'); break; }
      const list = S.lists.find((l) => l.id === c.list) || curList();
      const go = async () => {
        const img = getImg(list.id);
        const copied = img ? await copyImage(img) : null;
        if (c.status === 'none') markWrote(c);
        save(); render(); openUrl(url);
        if (img && !copied) notify('Картинку не удалось скопировать. Текст в чат вставлен, картинку прикрепите вручную.');
      };
      const warns = [];
      if (c.status === 'none' && todayCount() >= dayLimit()) warns.push('Сегодня уже написано ' + todayCount() + ' из ' + dayLimit() + '.');
      if (c.status === 'none' && waitLeft() > 0) warns.push('С прошлого сообщения прошло меньше ' + intervalMin() + ' мин (осталось ' + Math.ceil(waitLeft() / 60000) + ').');
      if (warns.length) confirmAsk(warns.join(' ') + ' Подготовить всё равно?', go); else go();
      break;
    }
    case 'next-skip': {
      const i = S.contacts.findIndex((x) => x.id === id);
      if (i >= 0) { const [c] = S.contacts.splice(i, 1); S.contacts.push(c); save(); render(); }
      break;
    }
    case 'img-del': {
      setImg(id, ''); const pv = document.getElementById('img-prev'); if (pv) pv.innerHTML = '<div class="meta">Не загружена</div>';
      break;
    }
    case 'limit-edit':
      openSheet('<h2>Лимит в день</h2><div class="note">Сколько новых первых сообщений вы пишете за день. При достижении приложение спросит подтверждение перед следующим. Считаются только первые сообщения (кнопка «Написать»), ответы со ссылкой не считаются.</div>' +
        '<label class="f"><span>Сообщений в день</span><input id="lim-n" type="number" inputmode="numeric" min="1" max="200" value="' + dayLimit() + '"></label>' +
        '<label class="f"><span>Пауза между сообщениями, минут (для подсказки «следующая через…»)</span><input id="lim-i" type="number" inputmode="numeric" min="0" max="600" value="' + intervalMin() + '"></label>' +
        '<div class="acts"><button class="btn" data-act="limit-save">Сохранить</button><button class="btn sec" data-act="sheet-close">Закрыть</button></div>');
      break;
    case 'limit-save': { const n = Math.round(+val('lim-n')); S.dayLimit = n >= 1 && n <= 200 ? n : 10;
      const m = Math.round(+val('lim-i')); S.intervalMin = m >= 1 && m <= 600 ? m : 30; save(); closeSheet(); break; }
    case 'reply-open': replySheet(id); break;
    case 'inbox-reply': { const o = takeInbox(el.dataset.k); if (o) { render(); replySheet(o.id); } break; }
    case 'reply-copy': { copyText(val('r-text')).then((ok) => notify(ok ? 'Текст скопирован' : 'Не удалось скопировать: выделите текст и скопируйте вручную')); break; }
    case 'reply-go': {
      const o = S.orders.find((x) => x.id === id); if (!o) break;
      copyText(val('r-text')).then((ok) => {
        if (!ok) { notify('Не удалось скопировать: выделите текст и скопируйте вручную'); return; }
        if (o.status === 'new') o.status = 'sent';
        o.repliedAt = today(); save(); closeSheet();
        if (o.url) openUrl(o.url);
        notify('Текст скопирован. Вставьте его на странице заказа и отправьте отклик сами.');
      });
      break;
    }
    case 'rtpl-new': replyTplSheet(null); break;
    case 'rtpl-edit': replyTplSheet(id); break;
    case 'rtpl-save': {
      const rec = { name: val('rt-name').trim() || 'Шаблон', text: val('rt-text') };
      if (id) Object.assign(S.replies.find((x) => x.id === id), rec); else S.replies.push(Object.assign({ id: uid() }, rec));
      save(); closeSheet(); break;
    }
    case 'rtpl-del': confirmAsk('Удалить шаблон?', () => { S.replies = S.replies.filter((x) => x.id !== id); if (!S.replies.length) S.replies = defaultReplies(); save(); closeSheet(); }); break;
    case 'inbox-take': {
      const i = INBOX.items.find((x) => x.key === el.dataset.k); if (!i) break;
      S.orders.push({ id: uid(), title: i.title, src: i.src, url: i.url, price: i.price || '', deadline: '', status: 'new',
        note: i.note, created: today(), fromInbox: i.key });
      markSeen([i.key]); save(); render(); break;
    }
    case 'import': importSheet(); break;
    case 'import-go': {
      const lines = val('imp').split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      let added = 0, skipped = 0, bad = 0; const L = curList();
      for (const ln of lines) {
        const p = ln.split(/\t|;/).map((s) => s.trim());
        if (!p[0] || /^название$/i.test(p[0])) continue;
        if (p.length < 3) { bad++; continue; }
        const rec = { id: uid(), list: L.id, name: p[0], addr: p[1] || '', phone: p[2] || '', rating: (p[3] || '').replace(',', '.'),
          reviews: p[4] || '', wa: p[5] || '', status: 'none', note: '' };
        const dup = S.contacts.some((c) => c.list === L.id && c.name.toLowerCase() === rec.name.toLowerCase() && normPhone(c.phone) === normPhone(rec.phone));
        if (dup) skipped++; else { S.contacts.push(rec); added++; }
      }
      save(); sheet = null; tab = 'contacts'; render();
      const msg = 'Добавлено: ' + added + (skipped ? ', повторов пропущено: ' + skipped : '') +
        (bad ? '. Строк не в формате «название; адрес; телефон» пропущено: ' + bad : '');
      notify(msg); break;
    }
    case 'export': {
      const json = JSON.stringify(S);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(
        () => notify('Копия в буфере обмена. Вставьте её в заметки.'),
        () => textSheet('Копия данных', 'Выделите всё и скопируйте.', json, '', ''));
      else textSheet('Копия данных', 'Выделите всё и скопируйте.', json, '', '');
      break;
    }
    case 'restore': textSheet('Вставить копию', 'Вставьте текст копии. Текущие данные будут заменены.', '', 'Восстановить', 'restore-go'); break;
    case 'restore-go': {
      let d = null; try { d = JSON.parse(val('tx')); } catch (x) {}
      if (!d || d.v !== 1 || !Array.isArray(d.orders) || !Array.isArray(d.contacts) || !Array.isArray(d.lists) || !d.lists.length) {
        notify('Это не похоже на копию MyMiniApp'); break; }
      confirmAsk('Заменить текущие данные копией?', () => { S = d; if (!(S.dayLimit > 0)) S.dayLimit = 10; if (!(S.intervalMin > 0)) S.intervalMin = 30; S.inbox = S.inbox || { url: '', seen: [] }; if (!Array.isArray(S.replies) || !S.replies.length) S.replies = defaultReplies(); if (!S.lists.find((l) => l.id === S.cur)) S.cur = S.lists[0].id; save(); closeSheet(); fetchInbox(true); });
      break;
    }
    case 'wipe': confirmAsk('Стереть все заказы, компании и тексты?', () => { S = fresh(); save(); render(); }); break;
    case 'sheet-close': closeSheet(); break;
  }
});
document.addEventListener('input', (e) => {
